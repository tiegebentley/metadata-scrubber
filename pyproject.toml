[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubmeta"
version = "0.1.0"
description = "Strip and randomize metadata on images and videos you own. For personal privacy only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "metadata-scrubber contributors" }]
# Runtime deps: keep this list small and offline. See factory/MISSION.md.
dependencies = [
    "Pillow>=10.0.0",   # image container read/write
    "piexif>=1.1.3",    # EXIF read/write for JPEG/TIFF
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-Pillow",
]

[project.scripts]
scrubmeta = "scrubmeta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
